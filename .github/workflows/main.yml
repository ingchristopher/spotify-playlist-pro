name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Crear .env
        shell: pwsh
        run: |
          @"
          SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          "@ | Out-File -Encoding utf8 .env

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine spotipy python-dotenv supabase requests

      - name: Compilar EXE
        run: |
          pyinstaller --windowed --noconfirm --clean --onedir --name SpotifyPlaylistPro --add-data ".env;." app.py

      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlaylistPro_Windows
          path: dist/SpotifyPlaylistPro
