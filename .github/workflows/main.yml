name: Build Windows EXE

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer ZIP si existe
        shell: pwsh
        run: |
          if (Test-Path "spotify_playlist_clean.zip") {
            Expand-Archive -Path "spotify_playlist_clean.zip" -DestinationPath "." -Force
          }

      - name: Ver archivos
        shell: pwsh
        run: |
          dir

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine spotipy python-dotenv supabase requests

      - name: Compilar EXE
        run: |
          pyinstaller --windowed --noconfirm --clean --onedir --name SpotifyPlaylistPro app.py

      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlaylistPro_Windows
          path: dist/SpotifyPlaylistPro
